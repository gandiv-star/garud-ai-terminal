name: Evidence matrix (Regime x Strategy)

# Manual only. Each run is stored as a NEW EVIDENCE_MATRIX event (older runs are kept).
on:
  workflow_dispatch:
    inputs:
      fill_model:
        description: "gap_aware_v2 (default: gap-down stops at the open + slippage) or legacy"
        required: false
        default: "gap_aware_v2"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Build evidence matrix
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TRADING_MODE: PAPER
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FILL_MODEL: ${{ github.event.inputs.fill_model || 'gap_aware_v2' }}
        run: python backtest/run_evidence_matrix.py
      - name: Save matrix CSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-matrix
          path: evidence_matrix.csv
          if-no-files-found: ignore
