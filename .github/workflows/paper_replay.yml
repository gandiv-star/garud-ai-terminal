name: Paper replay (momentum engine, last 2 years)

# Manual only. Replays the REAL momentum paper engine (whole shares, paper capital, real charges)
# over the last ~2 years and compares it with the backtest engine. Writes nothing to the paper
# portfolios; stores a NEW PAPER_REPLAY result and sends it to Telegram.
# Places no orders.
on:
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run paper replay
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TRADING_MODE: PAPER
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python backtest/run_paper_replay.py
