name: Rule paper trading (automatic)

on:
  schedule:
    - cron: "10 4 * * 1-5"   # 09:40 IST — entries at today's open + exits
    - cron: "40 5 * * 1-5"   # 11:10 IST — retry if the first run was delayed/failed (entries until 11:30)
    - cron: "10 9 * * 1-5"   # 14:40 IST — time exits due today: broker SELL before the close
    - cron: "35 9 * * 1-5"   # 15:05 IST — retry of the pre-close run
    - cron: "30 11 * * 1-5"  # 17:00 IST — exits after the close + daily Telegram summary
  workflow_dispatch: {}       # "Run workflow" button for a manual run

concurrency:
  group: rule-paper-trading
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run rules
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TRADING_MODE: ${{ vars.TRADING_MODE || 'PAPER' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          UPSTOX_SANDBOX_TOKEN: ${{ secrets.UPSTOX_SANDBOX_TOKEN }}
          GARUD_KILL_SWITCH: ${{ vars.GARUD_KILL_SWITCH }}
          # Live trading stays OFF unless ALL of these are set (see backtest/live_executor.py)
          BROKER_ACCESS_TOKEN: ${{ secrets.BROKER_ACCESS_TOKEN }}
          LIVE_ORDERS_ENABLED: ${{ vars.LIVE_ORDERS_ENABLED }}
          LIVE_RULES: ${{ vars.LIVE_RULES }}
          LIVE_START_DATE: ${{ vars.LIVE_START_DATE }}
          LIVE_MAX_ORDER_VALUE: ${{ vars.LIVE_MAX_ORDER_VALUE }}
        run: python backtest/run_rule_paper.py
      - name: Alert on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=⚠️ Garud automatic paper trading run FAILED. Details: ${RUN_URL}" > /dev/null
