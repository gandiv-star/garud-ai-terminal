name: Engine 2 — Swing 2.0 test (15 years)

# Manual only. Buy pullbacks in the strongest stocks, one Rs.1,00,000 account, 15 years.
# Stores a NEW SWING2_15Y result (older results kept) and sends the verdict to Telegram.
# Places no orders.
on:
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run swing 2.0 test
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TRADING_MODE: PAPER
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python backtest/run_swing2.py
      - name: Save yearly CSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swing2-15y
          path: swing2_yearly.csv
          if-no-files-found: ignore
