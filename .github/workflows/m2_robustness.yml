name: M2 robustness check (15 years)

# Manual only. Momentum 200 with 6 different settings + bootstrap + NIFTY 200 benchmarks.
# Stores a NEW M2_ROBUSTNESS result (older results kept) and sends the verdict to Telegram.
# Places no orders.
on:
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run robustness check
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TRADING_MODE: PAPER
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python backtest/run_m2_robustness.py
      - name: Save yearly CSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m2-robustness
          path: m2_robustness.csv
          if-no-files-found: ignore
