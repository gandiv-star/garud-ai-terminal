name: Phase 2 portfolio test (15 years)

# Manual only. One shared Rs.1,00,000 account over 15 years (true NIFTY 50 list).
# Stores a NEW PORTFOLIO_15Y result (older results kept) and sends the verdict to Telegram.
# Places no orders.
on:
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run portfolio test
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TRADING_MODE: PAPER
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python backtest/run_portfolio15.py
      - name: Save yearly CSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-15y
          path: portfolio15_yearly.csv
          if-no-files-found: ignore
