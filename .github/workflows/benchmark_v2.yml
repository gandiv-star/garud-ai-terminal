name: Rule benchmark v2 + v3 (gap-aware fills, real charges)

# Manual only. Stores benchmark v2 (gap-aware fills) and v3 (v2 + Upstox real charges) next to v1
# (v1 is never changed; already stored versions are never recomputed) and sends a v1/v2/v3
# comparison to Telegram. Places no orders.
on:
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compute and store benchmark v2 and v3
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TRADING_MODE: PAPER
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python backtest/run_benchmark_v2.py
